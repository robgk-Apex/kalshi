# Kalshi Trading Bot Configuration
# Copy this to config.yaml and fill in your details

api:
  # Demo (fake money) - start here!
  base_url: "https://demo-api.kalshi.co/trade-api/v2"
  ws_url: "wss://demo-api.kalshi.co/trade-api/ws/v2"

  # Production (real money) - switch to these when ready
  # base_url: "https://api.elections.kalshi.com/trade-api/v2"
  # ws_url: "wss://api.elections.kalshi.com/trade-api/ws/v2"

  key_id: "YOUR_KEY_ID_HERE"
  private_key_path: "keys/kalshi.pem"

strategy:
  # Focus mode:
  #   crypto_short = ONLY short-term up/down crypto (KXBTCD, KXETHD, ...)
  #   all          = crypto + every other market (the original behavior)
  mode: crypto_short

  min_edge: 0.05
  scan_interval: 30
  min_volume: 100

  # Short-term only: ignore any market that settles more than this many hours out.
  max_hours_to_expiry: 2
  # Don't pay more than this per contract (leaves room for payout on up/down bets).
  max_entry_price: 0.60

  # Which up/down crypto series to scan. Comment out to use the built-in
  # directional default (BTC/ETH/SOL/XRP/DOGE/BNB/HYPE).
  # crypto_series: ["KXBTCD", "KXETHD", "KXSOLD"]

risk:
  bankroll: 100
  max_bet_pct: 0.05
  max_contracts: 20
  max_positions: 10
  stop_loss_pct: 0.20
  daily_loss_limit: 20

logging:
  level: "INFO"
  file: "logs/bot.log"


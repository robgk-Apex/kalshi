<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SmartStay USA — rent beautiful homes across the USA. No guest booking fees, ever.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
<title>SmartStay USA — Book unforgettable stays</title>
<style>
:root{
  --brand:#ff385c;--brand-dark:#e11d48;--brand-soft:#fff0f3;--ink:#1a1a1a;--ink-2:#4b4b4b;--ink-3:#767676;
  --line:#ebebeb;--line-2:#dddddd;--bg:#fff;--bg-2:#f7f7f7;--gold:#f5b301;--green:#008a05;
  --radius:16px;--radius-lg:24px;--shadow-sm:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --shadow:0 6px 20px rgba(0,0,0,.10);--shadow-lg:0 12px 40px rgba(0,0,0,.16);--maxw:1280px;--header-h:76px;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.15;letter-spacing:-.01em}
h1{font-family:var(--serif);font-weight:700}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
.tnum{font-variant-numeric:tabular-nums}
.container{max-width:var(--maxw);margin:0 auto;padding:0 40px}
@media(max-width:740px){.container{padding:0 20px}}
.muted{color:var(--ink-3)}.center{text-align:center}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}.grow{flex:1}.hide{display:none!important}
.stack{display:flex;flex-direction:column}
.dot::before{content:"·";margin:0 6px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;background:var(--bg);color:var(--ink);transition:transform .08s,box-shadow .15s,background .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.pill:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn-primary{background:linear-gradient(120deg,var(--brand),var(--brand-dark));color:#fff;box-shadow:0 4px 14px rgba(255,56,92,.35)}
.btn-primary:hover{box-shadow:0 6px 22px rgba(255,56,92,.45)}
.btn-outline{border-color:var(--line-2);background:#fff}.btn-outline:hover{border-color:var(--ink)}
.btn-ghost{background:transparent}.btn-ghost:hover{background:var(--bg-2)}
.btn-lg{padding:14px 26px;font-size:16px;border-radius:12px}.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line-2);border-radius:999px;background:#fff;font-size:14px;font-weight:500;white-space:nowrap;transition:all .15s}
.pill:hover{border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);font-size:13px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--bg-2)}
.badge.instant{background:#eef7ee;color:var(--green)}
.badge.status-confirmed{background:#eef7ee;color:var(--green)}
.badge.status-pending{background:#fff7e6;color:#a86b00}
.badge.status-completed{background:#eef2ff;color:#3b4cca}
.badge.status-cancelled{background:#fdecec;color:#c62828}
header#app-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:var(--header-h);gap:16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;color:var(--brand);letter-spacing:-.02em}
.logo .mark{font-size:26px}.logo b{font-family:var(--serif);font-weight:700}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-link{padding:9px 14px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.nav-link:hover{background:var(--bg-2);color:var(--ink)}
@media(max-width:740px){.nav-links{display:none}}
.usermenu{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:6px 6px 6px 14px;background:#fff;transition:box-shadow .15s}
.usermenu:hover{box-shadow:var(--shadow-sm)}
.avatar{border-radius:50%;object-fit:cover;background:var(--bg-2)}
.menu-pop{position:absolute;right:0;top:calc(100% + 10px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);min-width:240px;overflow:hidden;padding:8px;z-index:60}
.menu-pop a,.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border:none;background:none;border-radius:10px;font-size:14.5px;color:var(--ink)}
.menu-pop a:hover,.menu-pop button:hover{background:var(--bg-2)}
.menu-sep{height:1px;background:var(--line);margin:8px 0}
.hero{position:relative;min-height:560px;display:flex;align-items:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,.12) 40%,rgba(0,0,0,.5))}
.hero-inner{position:relative;color:#fff;padding:80px 0}
.hero h1{font-size:clamp(38px,6vw,68px);color:#fff;max-width:820px;text-shadow:0 2px 30px rgba(0,0,0,.35);text-wrap:balance}
.hero p{font-size:clamp(17px,2.2vw,21px);max-width:560px;opacity:.95;text-shadow:0 1px 12px rgba(0,0,0,.4)}
.searchbox{background:#fff;border-radius:999px;box-shadow:var(--shadow-lg);display:flex;align-items:stretch;padding:8px;max-width:920px;margin-top:34px}
.searchbox .field{flex:1;padding:12px 22px;border-radius:999px;cursor:pointer;position:relative}
.searchbox .field:hover{background:var(--bg-2)}
.searchbox .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink)}
.searchbox .field input{border:none;outline:none;width:100%;padding:2px 0;background:none;font-size:15px;color:var(--ink)}
.searchbox .field input::placeholder{color:var(--ink-3)}
.searchbox .vsep{width:1px;background:var(--line);margin:10px 0}
.searchbox .submit{align-self:center}
.searchbox .submit button{height:56px;padding:0 26px;border-radius:999px}
@media(max-width:820px){.searchbox{flex-direction:column;border-radius:24px}.searchbox .vsep{display:none}.searchbox .field{border-bottom:1px solid var(--line);border-radius:14px}.searchbox .submit button{width:100%}}
.catrow{display:flex;gap:8px;overflow-x:auto;padding:20px 0 4px;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 12px;border:none;background:none;color:var(--ink-3);border-bottom:2px solid transparent;min-width:64px;font-size:12px;font-weight:600;transition:color .15s,border-color .15s}
.cat .ico{font-size:24px;filter:grayscale(.4)}
.cat:hover{color:var(--ink)}
.cat.active{color:var(--ink);border-bottom-color:var(--ink)}
.cat.active .ico{filter:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 24px}
.card{cursor:pointer}
.card .media{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:20/19;background:var(--bg-2)}
.card .media img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .media img{transform:scale(1.05)}
.card .fav{position:absolute;top:12px;right:12px;width:34px;height:34px;border:none;background:none;color:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));display:grid;place-items:center}
.card .fav svg{width:24px;height:24px}
.card .fav.on svg{fill:var(--brand);stroke:#fff}
.card .tag{position:absolute;top:12px;left:12px;background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-sm)}
.card .body{padding:11px 2px 0}
.card .title{font-weight:600;font-size:15.5px;margin:0;display:flex;justify-content:space-between;gap:8px}
.card .rating{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;white-space:nowrap}
.card .sub{color:var(--ink-3);font-size:14.5px;margin:2px 0}
.card .price{margin-top:5px;font-size:15px}.card .price b{font-weight:700}
section.block{padding:44px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px;gap:12px}
.section-head h2{font-size:28px}
.eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.detail-head{padding-top:26px}.detail-title{font-size:30px}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;border-radius:var(--radius-lg);overflow:hidden;height:460px;margin-top:18px}
.gallery img{width:100%;height:100%;object-fit:cover;cursor:pointer;transition:filter .2s}
.gallery img:hover{filter:brightness(.92)}
.gallery .main{grid-row:1/3}
@media(max-width:740px){.gallery{grid-template-columns:1fr;grid-template-rows:none;height:auto}.gallery img:not(.main){display:none}.gallery .main{height:300px}}
.detail-grid{display:grid;grid-template-columns:1fr 380px;gap:60px;padding:34px 0;align-items:start}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr;gap:24px}}
.detail-sec{padding:28px 0;border-top:1px solid var(--line)}
.detail-sec:first-child{border-top:none;padding-top:0}
.amenity-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.amenity{display:flex;align-items:center;gap:12px;font-size:15px}
.amenity .ico{font-size:20px;width:26px;text-align:center}
@media(max-width:600px){.amenity-grid{grid-template-columns:1fr}}
.booking-card{position:sticky;top:calc(var(--header-h) + 18px);border:1px solid var(--line-2);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:24px}
.booking-card .price-lead{font-size:22px;font-weight:700}
.booking-fields{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;margin:16px 0}
.booking-fields .r2{display:grid;grid-template-columns:1fr 1fr}
.bf{padding:10px 14px;border:1px solid transparent}
.bf+.bf{border-left:1px solid var(--line-2)}
.booking-fields .r2+.bf,.bf.rowtop{border-top:1px solid var(--line-2)}
.bf label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.bf input,.bf select{border:none;outline:none;width:100%;background:none;padding:2px 0;font-size:14px}
.price-line{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;color:var(--ink-2)}
.price-line.total{border-top:1px solid var(--line);margin-top:8px;padding-top:16px;font-weight:700;color:var(--ink);font-size:16.5px}
.price-line .u{text-decoration:underline}
.price-line.discount{color:var(--green)}
.strike{text-decoration:line-through;color:var(--ink-3)}
.save-callout{margin-top:12px;background:#eef7ee;color:var(--green);border:1px solid #cde9cd;border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600;text-align:center}
.quiz-overlay{position:fixed;inset:0;z-index:150;background:linear-gradient(160deg,#ffffff,#fff6f8 60%,#fff0f3);overflow:auto;animation:fade .2s}
.quiz-inner{max-width:760px;margin:0 auto;padding:30px 24px 70px;min-height:100%}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.quiz-bar{height:6px;background:var(--line);border-radius:999px;margin:22px 0 30px;overflow:hidden}
.quiz-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-dark));transition:width .3s ease}
.quiz-q{font-size:clamp(24px,4vw,34px);font-family:var(--serif);margin:4px 0 0;text-wrap:balance}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.quiz-opt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line-2);border-radius:16px;padding:18px;cursor:pointer;background:#fff;font-size:16px;font-weight:600;transition:border-color .15s,transform .08s,box-shadow .15s;text-align:left}
.quiz-opt:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow)}
.quiz-opt.on{border-color:var(--brand);background:var(--brand-soft)}
.quiz-opt .ico{font-size:30px;line-height:1}
.quiz-opt small{display:block;color:var(--ink-3);font-weight:500;font-size:13px;margin-top:2px}
@media(max-width:560px){.quiz-opts{grid-template-columns:1fr}}
.quiz-hero-btn{display:inline-block;margin-top:20px;background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(6px);border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;transition:background .15s,transform .08s}
.quiz-hero-btn:hover{background:rgba(255,255,255,.28)}
.quiz-hero-btn:active{transform:scale(.97)}
.quiz-why{margin-top:8px;font-size:13px;font-weight:600;color:var(--green);line-height:1.45}
.hero-badge{display:inline-block;background:rgba(0,138,5,.92);color:#fff;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;margin-bottom:18px;box-shadow:var(--shadow)}
.review-summary{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700}
.reviews-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 44px;margin-top:22px}
@media(max-width:740px){.reviews-grid{grid-template-columns:1fr}}
.review .who{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.review .who .avatar{width:44px;height:44px}
.stars{color:var(--gold);letter-spacing:1px}
.form{display:flex;flex-direction:column;gap:14px}
.field-group{display:flex;flex-direction:column;gap:6px}
.field-group label{font-size:13px;font-weight:700}
.input,.form input,.form select,.form textarea{border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:15px;width:100%;background:#fff;transition:border-color .15s,box-shadow .15s}
.input:focus,.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.form textarea{resize:vertical;min-height:100px}
.auth-wrap{max-width:440px;margin:60px auto;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.auth-head{padding:22px 26px;border-bottom:1px solid var(--line);text-align:center;font-weight:700}
.auth-body{padding:26px}
.demo-note{background:var(--brand-soft);border:1px dashed #ffb3c1;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--brand-dark)}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role-card{border:1.5px solid var(--line-2);border-radius:14px;padding:16px 14px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s,transform .08s;background:#fff}
.role-card:hover{border-color:var(--ink)}
.role-card:active{transform:scale(.98)}
.role-card.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(255,56,92,.12)}
.role-card .ico{font-size:30px}
.role-card b{display:block;margin-top:6px;font-size:15px}
.role-card span{display:block;color:var(--ink-3);font-size:12.5px;margin-top:3px;line-height:1.35}
@media(max-width:440px){.role-cards{grid-template-columns:1fr}}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin:8px 0 28px}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;background:linear-gradient(180deg,#fff,#fcfcfc)}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-.02em}
.stat .l{color:var(--ink-3);font-size:13.5px;font-weight:600}
.list-row{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.list-row .thumb{width:110px;height:84px;border-radius:12px;object-fit:cover;flex-shrink:0;cursor:pointer}
@media(max-width:600px){.list-row{flex-wrap:wrap}.list-row .thumb{width:100%;height:150px}}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer}
.check input{width:auto}.check.on{border-color:var(--ink);background:var(--bg-2)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:100;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .18s}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.modal-body{padding:22px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg-2);display:grid;place-items:center;font-size:18px}
.iconbtn:hover{background:var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:120;display:grid;place-items:center}
.lightbox img{max-width:92vw;max-height:86vh;border-radius:12px}
.lightbox .lb-close{position:absolute;top:20px;right:24px;color:#fff;font-size:30px;background:none;border:none}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:#fff;background:none;border:none;padding:0 20px}
.lightbox .prev{left:10px}.lightbox .next{right:10px}
#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14.5px;font-weight:500;animation:pop .2s;max-width:90vw}
.toast.err{background:#c62828}.toast.ok{background:#0a7d2c}
footer#app-footer{border-top:1px solid var(--line);background:var(--bg-2);margin-top:40px}
.footcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px;padding:44px 0}
.footcols h4{font-size:14px}
.footcols a{display:block;color:var(--ink-3);font-size:14px;padding:5px 0}
.footcols a:hover{color:var(--ink);text-decoration:underline}
.footbar{border-top:1px solid var(--line-2);padding:20px 0;font-size:13.5px;color:var(--ink-3)}
.skel{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--radius)}
@keyframes shimmer{to{background-position:-200% 0}}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:70px 20px;color:var(--ink-3)}
.empty .big{font-size:46px;margin-bottom:10px}
.map-box{height:320px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);background:#e8eef3;position:relative}
.map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.map-pin::after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
.breadcrumb{color:var(--ink-3);font-size:14px;padding:16px 0}
.breadcrumb a:hover{text-decoration:underline;color:var(--ink)}
.smap{position:relative;height:420px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);background:#dfe7ef;touch-action:none;cursor:grab;user-select:none}
.smap.search{height:620px;border-radius:var(--radius);position:sticky;top:calc(var(--header-h) + 16px)}
.smap.grabbing{cursor:grabbing}
.smap svg{width:100%;height:100%;display:block}
.smap-ctrl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.smap-ctrl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font-size:18px;box-shadow:var(--shadow-sm);display:grid;place-items:center}
.smap-ctrl button:hover{background:var(--bg-2)}

/* ---------- generated artwork (CSP-safe SVG data URIs) ---------- */
const PHOTO_EMOJI = ['🏡','🛋️','🛏️','🌅','🍳','🛁'];
// Per-property visual themes so each home's imagery corresponds to its character.
const PHOTO_THEMES = {

  mountain: { hue: 158, emojis: ['🏔️','🌲','🎿','🔥','🛷'] },

  lake:     { hue: 188, emojis: ['🛶','🏞️','🎣','🌲','🚣'] },

  house:    { hue: 20,  emojis: ['🏡','🛋️','🛏️','🍳','🌿'] },
};
function svgPhoto(hue, emoji, label){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'>
    <defs>
      <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
        <stop offset='0' stop-color='hsl(${hue},68%,60%)'/>
        <stop offset='1' stop-color='hsl(${(hue+42)%360},60%,42%)'/>
      </linearGradient>
      <radialGradient id='r' cx='30%' cy='24%' r='80%'>
        <stop offset='0' stop-color='rgba(255,255,255,.4)'/>
        <stop offset='1' stop-color='rgba(255,255,255,0)'/>
      </radialGradient>
    </defs>
    <rect width='800' height='600' fill='url(#g)'/>
    <rect width='800' height='600' fill='url(#r)'/>
    <text x='400' y='340' font-size='200' text-anchor='middle' opacity='.30'>${emoji}</text>
    <rect x='0' y='460' width='800' height='140' fill='rgba(0,0,0,.20)'/>
    <text x='42' y='540' font-size='34' fill='rgba(255,255,255,.96)' font-family='Georgia,serif'>${label}</text>
  </svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
function photoSet(theme, label){
  const t = PHOTO_THEMES[theme] || PHOTO_THEMES.house;
  return t.emojis.map((e,i)=>svgPhoto((t.hue + i*9) % 360, e, label));
}
function svgAvatar(name){
  const initials = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  let hue=0; for(const c of name) hue=(hue+c.charCodeAt(0))%360;

}

/* ---------- pricing / availability engine ---------- */
const SERVICE_FEE_PCT=0, TAX_PCT=0.08, AIRBNB_GUEST_FEE_PCT=0.14;
const toUTC=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const nightsBetween=(a,b)=>Math.round((toUTC(b)-toUTC(a))/864e5);
function eachNight(a,b){const out=[];for(let d=new Date(toUTC(a));d<toUTC(b);d.setUTCDate(d.getUTCDate()+1))out.push(new Date(d));return out;}
const r2=n=>Math.round(n*100)/100;
function quote(listing,checkIn,checkOut,guests=1){
  const p=listing.pricing||{},nights=nightsBetween(checkIn,checkOut);
  if(!checkIn||!checkOut||isNaN(nights)||nights<=0)return{ok:false,error:'Select valid check-in and check-out dates.'};
  if((listing.minNights||1)>nights)return{ok:false,error:`This home has a ${listing.minNights}-night minimum.`};
  if(guests>(listing.maxGuests||1))return{ok:false,error:`This home hosts up to ${listing.maxGuests} guests.`};
  let base=0;
  for(const n of eachNight(checkIn,checkOut)){const dow=n.getUTCDay();const wknd=dow===5||dow===6;base+=(wknd&&p.weekendNightly)?p.weekendNightly:p.nightly;}
  let dPct=0,dLabel='';
  if(nights>=28&&p.monthlyDiscountPct){dPct=p.monthlyDiscountPct;dLabel='Monthly discount';}
  else if(nights>=7&&p.weeklyDiscountPct){dPct=p.weeklyDiscountPct;dLabel='Weekly discount';}
  const discount=r2(base*dPct/100),subtotal=r2(base-discount),cleaningFee=r2(p.cleaningFee||0);
  const serviceFee=r2(subtotal*SERVICE_FEE_PCT),taxes=r2((subtotal+cleaningFee)*TAX_PCT);
  const total=r2(subtotal+cleaningFee+serviceFee+taxes);
  const airbnbFee=r2(subtotal*AIRBNB_GUEST_FEE_PCT);
  return{ok:true,nights,base:r2(base),avgPerNight:r2(base/nights),discountPct:dPct,discountLabel:dLabel,discount,subtotal,cleaningFee,serviceFee,taxes,total,airbnbFee,savingsVsAirbnb:airbnbFee};
}
const fromNightly=l=>Math.min(l.pricing?.nightly??Infinity,l.pricing?.weekendNightly??Infinity);

function blockedRanges(l,bookings){
  const active=bookings.filter(b=>b.listingId===l.id&&['pending','confirmed'].includes(b.status)).map(b=>({checkIn:b.checkIn,checkOut:b.checkOut}));
  return[...active,...(l.blockedDates||[])];
}

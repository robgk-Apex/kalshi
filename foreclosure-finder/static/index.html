<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreclosure Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/" data-link>Foreclosure<span>Finder</span></a>
  <form id="searchForm" class="search" role="search">
    <input id="q" type="search" placeholder="Address, city, ZIP, or keyword" autocomplete="off">
  </form>
  <button id="filterToggle" class="btn ghost only-mobile" type="button">Filters</button>
</header>

<main id="listView" class="layout">
  <aside id="filters" class="filters">
    <div class="f-head"><h2>Filters</h2><button id="reset" class="link" type="button">Reset</button></div>
    <label>State<select id="state"><option value="">All states</option></select></label>
    <label>City<select id="city"><option value="">All cities</option></select></label>
    <label>Property type<select id="property_type"><option value="">All types</option></select></label>
    <label>ZIP code<input id="zip" inputmode="numeric" maxlength="5" placeholder="e.g. 30310"></label>
    <fieldset><legend>Price</legend>
      <div class="row2"><input id="min_price" inputmode="numeric" placeholder="Min $"><input id="max_price" inputmode="numeric" placeholder="Max $"></div>
    </fieldset>
    <fieldset><legend>Bedrooms</legend><div class="chips" id="beds" data-name="min_beds"></div></fieldset>
    <fieldset><legend>Bathrooms</legend><div class="chips" id="baths" data-name="min_baths"></div></fieldset>
    <fieldset><legend>Square feet</legend>
      <div class="row2"><input id="min_sqft" inputmode="numeric" placeholder="Min"><input id="max_sqft" inputmode="numeric" placeholder="Max"></div>
    </fieldset>
    <fieldset><legend>Amenities</legend><div id="amenities" class="checks"></div></fieldset>
    <label>Source<select id="source"><option value="">All sources</option></select></label>
  </aside>

  <section class="results">
    <div class="r-head">
      <p id="count" class="count">Loading…</p>
      <div class="r-tools">
        <select id="sort" aria-label="Sort">
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
          <option value="ppsf_asc">Lowest $ / sq ft</option>
          <option value="sqft_desc">Largest</option>
          <option value="newest">Newest</option>
        </select>
        <div class="seg" role="tablist">
          <button class="on" data-view="grid" type="button">Grid</button>
          <button data-view="map" type="button">Map</button>
        </div>
      </div>
    </div>
    <div id="map" class="bigmap" hidden></div>
    <div id="grid" class="grid"></div>
    <nav id="pager" class="pager"></nav>
  </section>
</main>

<main id="detailView" class="detail" hidden></main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" type="button" aria-label="Close">×</button>
  <button class="lb-prev" type="button" aria-label="Previous">‹</button>
  <img alt="">
  <button class="lb-next" type="button" aria-label="Next">›</button>
  <p class="lb-cap"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

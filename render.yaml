# One-click deploy to Render — https://render.com
# New > Blueprint > point at this repo. Render builds the Dockerfile, injects
# PORT, and gives you a public HTTPS URL.
#
# Runs in public (no-keys) live mode by default. To also show your account
# balance, set KALSHI_KEY_ID and KALSHI_PRIVATE_KEY (the PEM contents) as
# secrets in the Render dashboard — they're declared below with sync:false so
# Render treats them as optional secrets you fill in (leave blank for public).
services:
  - type: web
    name: kalshi-dashboard
    runtime: docker
    plan: free
    branch: claude/new-session-ww2byg
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: KALSHI_BASE_URL
        value: https://api.elections.kalshi.com/trade-api/v2
      - key: KALSHI_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
